version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=domain_qa_bot
      - CHROMA_PERSIST_DIR=./data/chroma_db
      - RAW_DOCS_DIR=./data/raw_docs
    volumes:
      - ./data:/app/data
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
